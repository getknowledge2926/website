<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Icon Emblem: Book of Knowledge meets Illuminating Torch/Bulb -->
  <g transform="translate(10, 15)">
    <!-- Glow back rounded square -->
    <rect width="60" height="60" rx="16" fill="url(#logoGrad)" />
    
    <!-- Open Book / Pages of Knowledge -->
    <path d="M 30 25 C 22 20 16 23 16 23 L 16 43 C 16 43 22 40 30 45 C 38 40 44 43 44 43 L 44 23 C 44 23 38 20 30 25 Z" fill="#ffffff" />
    <path d="M 30 25 L 30 45" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Torch flame / Knowledge Spark on top -->
    <path d="M 30 14 C 33 17 33 20 30 22 C 27 20 27 17 30 14 Z" fill="url(#sparkleGrad)" />
    
    <!-- Bridge arch underline -->
    <path d="M 16 51 C 24 45 36 45 44 51" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="86" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    Get <tspan fill="#4F46E5">Knowledge</tspan>
  </text>
  
  <text x="87" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="2.5">
    ONLINE LIVE LEARNING &bull; LIVE COHORTS
  </text>

  <!-- Small accent spark dot -->
  <circle cx="370" cy="30" r="4" fill="url(#sparkleGrad)" />
</svg>
