<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Outer Card Frame with subtle shadow -->
  <rect x="10" y="10" width="400" height="500" rx="24" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header Banner -->
  <path d="M 10 34 C 10 20.7 20.7 10 34 10 L 386 10 C 399.3 10 410 20.7 410 34 L 410 80 L 10 80 Z" fill="url(#headerGrad)" />
  
  <text x="210" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">
    OFFICIAL UPI PAYMENT
  </text>
  <text x="210" y="65" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e0e7ff">
    Scan with GPay, PhonePe, Paytm, or Any UPI App
  </text>

  <!-- Payee Badge -->
  <g transform="translate(60, 95)">
    <rect width="300" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="150" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e40af">
      Merchant: Get Knowledge
    </text>
  </g>

  <!-- QR Outer Scanner Frame -->
  <rect x="80" y="145" width="260" height="260" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Scanner Corner Accents -->
  <!-- Top Left -->
  <path d="M 95 170 L 95 160 C 95 151.7 101.7 145 110 145 L 120 145" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Top Right -->
  <path d="M 300 145 L 310 145 C 318.3 145 325 151.7 325 160 L 325 170" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Bottom Left -->
  <path d="M 95 380 L 95 390 C 95 398.3 101.7 405 110 405 L 120 405" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Bottom Right -->
  <path d="M 300 405 L 310 405 C 318.3 405 325 398.3 325 390 L 325 380" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Standard Top-Left Position Detection Pattern -->
  <rect x="110" y="175" width="55" height="55" rx="6" fill="#0f172a" />
  <rect x="119" y="184" width="37" height="37" rx="3" fill="#ffffff" />
  <rect x="126" y="191" width="23" height="23" rx="2" fill="#0f172a" />

  <!-- Standard Top-Right Position Detection Pattern -->
  <rect x="255" y="175" width="55" height="55" rx="6" fill="#0f172a" />
  <rect x="264" y="184" width="37" height="37" rx="3" fill="#ffffff" />
  <rect x="271" y="191" width="23" height="23" rx="2" fill="#0f172a" />

  <!-- Standard Bottom-Left Position Detection Pattern -->
  <rect x="110" y="320" width="55" height="55" rx="6" fill="#0f172a" />
  <rect x="119" y="329" width="37" height="37" rx="3" fill="#ffffff" />
  <rect x="126" y="336" width="23" height="23" rx="2" fill="#0f172a" />

  <!-- Simulated Data Matrix Grid -->
  <g fill="#0f172a">
    <rect x="180" y="175" width="14" height="28" />
    <rect x="205" y="175" width="28" height="14" />
    <rect x="220" y="200" width="14" height="20" />
    <rect x="180" y="215" width="28" height="14" />

    <rect x="110" y="245" width="24" height="14" />
    <rect x="145" y="245" width="14" height="28" />
    <rect x="170" y="245" width="35" height="14" />
    <rect x="220" y="235" width="28" height="35" />
    <rect x="260" y="245" width="20" height="28" />
    <rect x="290" y="245" width="20" height="14" />

    <rect x="110" y="275" width="28" height="14" />
    <rect x="150" y="275" width="18" height="28" />
    <rect x="180" y="275" width="40" height="14" />
    <rect x="235" y="280" width="35" height="18" />
    <rect x="280" y="270" width="30" height="20" />

    <rect x="180" y="320" width="18" height="40" />
    <rect x="210" y="315" width="30" height="16" />
    <rect x="250" y="320" width="20" height="20" />
    <rect x="285" y="320" width="25" height="15" />

    <rect x="180" y="365" width="30" height="12" />
    <rect x="225" y="350" width="30" height="27" />
    <rect x="270" y="355" width="40" height="20" />
  </g>

  <!-- Center Watermark Emblem -->
  <circle cx="210" cy="275" r="22" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
  <text x="210" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#4f46e5">
    UPI
  </text>

  <!-- Watermark Overlay Banner: Clear Reminder that this is a placeholder -->
  <g transform="translate(45, 418)">
    <rect width="330" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
    <text x="165" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#92400e">
      ⚠️ PLACEHOLDER SAMPLE QR
    </text>
    <text x="165" y="33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#b45309">
      Replace with your real QR image in assets/images/
    </text>
  </g>

  <!-- Bottom UPI partner app badges -->
  <g transform="translate(40, 474)">
    <text x="170" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b">
      Accepted: Google Pay &bull; PhonePe &bull; Paytm &bull; BHIM &bull; CRED &bull; Any Banking App
    </text>
  </g>
</svg>
